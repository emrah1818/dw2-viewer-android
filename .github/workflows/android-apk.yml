name: Android APK - DW2 3D Viewer
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Android SDK-Komponenten
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: three.js holen
        run: bash tools/fetch_deps.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests der Android-Brücke und der Animationswiedergabe
        run: |
          python -m pip install --upgrade pip numpy pillow
          python tests/test_android_api.py
          python tests/test_android_edit.py
          python tests/test_native_anim.py
          node tests/test_native_anim.mjs

      - name: Build-Kennung
        run: |
          VER=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "APK_NAME=DW2_3D_Viewer_v$VER.apk" >> "$GITHUB_ENV"
            echo "REL_TAG=v$VER" >> "$GITHUB_ENV"
            echo "REL_NAME=DW2 Mobile 3D Viewer v$VER" >> "$GITHUB_ENV"
            echo "REL_PRE=false" >> "$GITHUB_ENV"
          else
            echo "APK_NAME=DW2_3D_Viewer_v4.2_Full_Animation_Support_test.apk" >> "$GITHUB_ENV"
            echo "REL_TAG=test-full-animation-support" >> "$GITHUB_ENV"
            echo "REL_NAME=DW2 Mobile 3D Viewer – Test-Build ($GITHUB_REF_NAME)" >> "$GITHUB_ENV"
            echo "REL_PRE=true" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test-APK bauen
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: APK prüfen
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk)
          unzip -l "$APK" | grep -E "assets/www/index.html|assets/www/lib/three.module.js|libpython"
          cp "$APK" "$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: DW2-3D-Viewer-test-apk
          path: ${{ env.APK_NAME }}

      - name: APK als Release veröffentlichen (main = Version aus build.gradle.kts, sonst Test-Build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          name: ${{ env.REL_NAME }}
          prerelease: ${{ env.REL_PRE }}
          make_latest: ${{ env.REL_PRE == 'false' }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.APK_NAME }}
          body: |
            ${{ env.REL_PRE == 'false' && 'Vollständige Animationsunterstützung, PS1-Darstellung (Rückseiten, Mischmodi), adaptives App-Symbol, Original-Hintergrund von Digimon World 2 mit grünem Statusfenster und Original-Schatten. Auf dem Handy herunterladen und installieren.' || format('Automatischer Test-Build ({0}, {1}). Keine finale Veröffentlichung.', github.ref_name, github.sha) }}

      # Für die Veröffentlichung: signiertes Release-Bundle, nur wenn die Secrets gesetzt sind.
      - name: Release-Signatur vorbereiten
        if: github.ref_name == 'main'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DW2_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "HAVE_KEYSTORE=1" >> "$GITHUB_ENV"
          fi

      - name: Signiertes AAB (Google Play) und APK bauen
        if: env.HAVE_KEYSTORE == '1'
        env:
          DW2_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DW2_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DW2_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease :app:assembleRelease

      - uses: actions/upload-artifact@v4
        if: env.HAVE_KEYSTORE == '1'
        with:
          name: DW2-3D-Viewer-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
