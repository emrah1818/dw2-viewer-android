name: Android APK - DW2 3D Viewer
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Android SDK-Komponenten
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Abhängigkeiten holen (Konverter, Header, three.js)
        run: bash tools/fetch_deps.sh

      - name: Tests der Android-Brücke
        run: |
          python -m pip install --upgrade pip numpy pillow
          python tests/test_android_api.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test-APK bauen
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: APK prüfen
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk)
          unzip -l "$APK" | grep -E "arm64-v8a/libdw2conv.so|assets/www/index.html|assets/www/lib/three.module.js"
          cp "$APK" DW2_3D_Viewer_v4.0_test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DW2-3D-Viewer-test-apk
          path: DW2_3D_Viewer_v4.0_test.apk

      - name: Test-APK als Download-Seite veröffentlichen (Release "test-build")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Test-APK (neuester Build)
          prerelease: true
          files: DW2_3D_Viewer_v4.0_test.apk
          body: Neuester automatischer Test-Build. Auf dem Handy herunterladen und installieren.

      # Für die Veröffentlichung: signiertes Release-Bundle, nur wenn die Secrets gesetzt sind.
      - name: Release-Signatur vorbereiten
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DW2_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "HAVE_KEYSTORE=1" >> "$GITHUB_ENV"
          fi

      - name: Signiertes AAB (Google Play) und APK bauen
        if: env.HAVE_KEYSTORE == '1'
        env:
          DW2_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DW2_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DW2_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease :app:assembleRelease

      - uses: actions/upload-artifact@v4
        if: env.HAVE_KEYSTORE == '1'
        with:
          name: DW2-3D-Viewer-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
