name: three.js ins Repository übernehmen
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tools/fetch_deps.sh
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f app/src/main/assets/www/lib
          git commit -m "three.js 0.160.0 (MIT) einbinden" || echo "nichts zu tun"
          git push
